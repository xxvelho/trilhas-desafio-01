<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="t-aureo">
  <title id="t-aureo">Relógio Clássico Áureo, caixa dourada, mostrador marfim e pulseira de couro marrom</title>
  <defs>
    <linearGradient id="caixa-aureo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d98a"/>
      <stop offset="0.5" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#8a6a22"/>
    </linearGradient>
    <radialGradient id="brilho-aureo" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Correia -->
  <rect x="110" y="8" width="80" height="90" rx="10" fill="#5a3a22"/>
  <rect x="110" y="202" width="80" height="90" rx="10" fill="#5a3a22"/>
    <line x1="120" y1="12" x2="120" y2="82" stroke="#c9a24b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="180" y1="12" x2="180" y2="82" stroke="#c9a24b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="120" y1="218" x2="120" y2="288" stroke="#c9a24b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="180" y1="218" x2="180" y2="288" stroke="#c9a24b" stroke-width="1.5" stroke-dasharray="4 4"/>
    

  <!-- Coroa -->
  <rect x="224" y="140" width="14" height="20" rx="3" fill="url(#caixa-aureo)"/>
  <rect x="228" y="143" width="2" height="14" fill="#2b2118" opacity="0.5"/>

  <!-- Caixa e aro -->
  <circle cx="150" cy="150" r="80" fill="url(#caixa-aureo)"/>
  <circle cx="150" cy="150" r="72" fill="#a8842f"/>

  <!-- Mostrador -->
  <circle cx="150" cy="150" r="66" fill="#f3ead3"/>
  <circle cx="150" cy="150" r="66" fill="url(#brilho-aureo)"/>
    <line x1="150" y1="92" x2="150" y2="106" stroke="#2b2118" stroke-width="4" stroke-linecap="round" transform="rotate(0 150 150)"/>
    <line x1="150" y1="94" x2="150" y2="100" stroke="#2b2118" stroke-width="2" stroke-linecap="round" transform="rotate(30 150 150)"/>
    <line x1="150" y1="94" x2="150" y2="100" stroke="#2b2118" stroke-width="2" stroke-linecap="round" transform="rotate(60 150 150)"/>
    <line x1="150" y1="92" x2="150" y2="106" stroke="#2b2118" stroke-width="4" stroke-linecap="round" transform="rotate(90 150 150)"/>
    <line x1="150" y1="94" x2="150" y2="100" stroke="#2b2118" stroke-width="2" stroke-linecap="round" transform="rotate(120 150 150)"/>
    <line x1="150" y1="94" x2="150" y2="100" stroke="#2b2118" stroke-width="2" stroke-linecap="round" transform="rotate(150 150 150)"/>
    <line x1="150" y1="92" x2="150" y2="106" stroke="#2b2118" stroke-width="4" stroke-linecap="round" transform="rotate(180 150 150)"/>
    <line x1="150" y1="94" x2="150" y2="100" stroke="#2b2118" stroke-width="2" stroke-linecap="round" transform="rotate(210 150 150)"/>
    <line x1="150" y1="94" x2="150" y2="100" stroke="#2b2118" stroke-width="2" stroke-linecap="round" transform="rotate(240 150 150)"/>
    <line x1="150" y1="92" x2="150" y2="106" stroke="#2b2118" stroke-width="4" stroke-linecap="round" transform="rotate(270 150 150)"/>
    <line x1="150" y1="94" x2="150" y2="100" stroke="#2b2118" stroke-width="2" stroke-linecap="round" transform="rotate(300 150 150)"/>
    <line x1="150" y1="94" x2="150" y2="100" stroke="#2b2118" stroke-width="2" stroke-linecap="round" transform="rotate(330 150 150)"/>

  <!-- Ponteiros marcando 10:10 -->
  <line x1="150" y1="150" x2="150" y2="116" stroke="#2b2118" stroke-width="5" stroke-linecap="round" transform="rotate(-60 150 150)"/>
  <line x1="150" y1="150" x2="150" y2="98" stroke="#2b2118" stroke-width="3.5" stroke-linecap="round" transform="rotate(60 150 150)"/>
  <line x1="150" y1="162" x2="150" y2="94" stroke="#a8321f" stroke-width="1.5" stroke-linecap="round" transform="rotate(150 150 150)"/>
  <circle cx="150" cy="150" r="5" fill="#a8321f"/>
  <circle cx="150" cy="150" r="2" fill="#f3ead3"/>
</svg>
