<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="t-executivo">
  <title id="t-executivo">Relógio Executivo Aço, caixa e pulseira de aço inoxidável e mostrador azul</title>
  <defs>
